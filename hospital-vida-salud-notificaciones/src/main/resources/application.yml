
server:
  port: 8083

spring:
  application:
    name: hospital-vida-salud-notificaciones

  r2dbc:
    url: r2dbc:mysql://localhost:3306/HOSPITAL_VIDA_SALUD
    username: root
    password: ""

  rabbitmq:
