
server:
  port: 8082

spring:
  application:
    name: hospital-vida-salud-citas

  r2dbc:
    url: r2dbc:mysql://localhost:3306/HOSPITAL_VIDA_SALUD
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true