
server:
  port: 8761

spring:
  application:
    name: hospital-vida-salud-eureka

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    jersey:
      enabled: false
  server:
    enable-self-preservation: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.netflix.discovery.shared.transport.jersey3.EurekaJersey3ClientImpl: OFF